# ──────────────────────────────────────────────────────────────────────────────
# MyTwoCents – Configurações da Aplicação (Versão Desktop Standalone)
# ──────────────────────────────────────────────────────────────────────────────

spring.application.name=mytwocents

# ── H2 Database (Banco Local Embutido) ────────────────────────────────────────
# O banco de dados será salvo na pasta pessoal do usuário (ex: C:\Users\Nome\.mytwocents no Windows ou ~/.mytwocents no Linux)
# Isso garante que se o usuário reinstalar ou mover o app, os dados continuam salvos lá.
spring.datasource.url=jdbc:h2:file:${user.home}/.mytwocents/data;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar console H2 (desativado por segurança no uso final)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Flyway DB Migration ───────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

server.port=8085
app.version=@project.version@

