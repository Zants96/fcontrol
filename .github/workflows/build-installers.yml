name: Build and Release Multi-Platform Installers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  version:
    name: Calculate Next Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_action.outputs.new_tag }}
      clean_version: ${{ steps.tag_action.outputs.new_version }}
      changelog: ${{ steps.tag_action.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Bump version and push tag
        id: tag_action
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: always() && (needs.version.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.version.result == 'skipped'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: Windows-EXE
            type: exe
          - os: ubuntu-latest
            target: Linux-DEB
            type: deb
          - os: ubuntu-latest
            target: Linux-RPM
            type: rpm
          - os: macos-latest
            target: macOS-DMG
            type: dmg

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm fakeroot

    - name: Set version in pom.xml
      shell: bash
      run: |
        VERSION=${{ needs.version.outputs.clean_version }}
        if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
        ./mvnw versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Create Custom JRE (jlink)
      shell: bash
      run: |
        mkdir -p target/jpackage-input
        # Copia o JAR com nome genérico para evitar erro de versão no jpackage
        cp target/mytwocents-*.jar target/jpackage-input/mytwocents.jar
        $JAVA_HOME/bin/jlink --add-modules java.se,jdk.unsupported,java.management,java.desktop,java.naming,java.sql,java.net.http,java.instrument,java.rmi,java.security.jgss,jdk.crypto.ec,jdk.charsets,jdk.localedata,java.xml,java.management.rmi,jdk.jsobject,jdk.xml.dom,jdk.zipfs,jdk.crypto.cryptoki,jdk.naming.dns --output target/custom-jre --no-header-files --no-man-pages

    - name: Run jpackage
      shell: bash
      run: |
        # Configurar ícone baseado na plataforma
        ICON="src/main/resources/static/icon.png"
        if [ "${{ matrix.os }}" == "windows-2022" ]; then
          ICON="src/main/resources/static/icon.ico"
        fi

        # Comando base do jpackage usando a versão calculada ou fallback
        VERSION=${{ needs.version.outputs.clean_version }}
        if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi

        $JAVA_HOME/bin/jpackage \
          --input target/jpackage-input \
          --name "MyTwoCents" \
          --main-jar "mytwocents.jar" \
          --type ${{ matrix.type }} \
          --dest release \
          --app-version "$VERSION" \
          --description "MyTwoCents - Gerenciamento Financeiro" \
          --vendor "Leandro Jose Lesnik" \
          --icon "$ICON" \
          --runtime-image target/custom-jre --resource-dir src/main/resources/package/linux --verbose \
          ${{ matrix.os == 'windows-2022' && '--win-shortcut --win-menu --win-dir-chooser' || '' }} \
          ${{ matrix.os == 'ubuntu-latest' && '--linux-shortcut --linux-package-name mytwocents --linux-app-category Office --linux-menu-group Office' || '' }}

    - name: Sign RPM Package (Linux)
      if: matrix.os == 'ubuntu-latest' && matrix.type == 'rpm' && env.HAS_GPG_SECRET == 'true'
      env:
        HAS_GPG_SECRET: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        echo "Signing RPM package..."

        # 1. Set up a clean GPG home directory
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg

        # 2. Write gpg-agent config BEFORE starting the agent
        #    (overwrite to avoid duplicates from any previous state)
        printf "allow-preset-passphrase\nallow-loopback-pinentry\n" > ~/.gnupg/gpg-agent.conf

        # 3. Kill any stale agent — gpg will auto-start a fresh one with the new config
        gpgconf --kill gpg-agent || true

        # 4. Import the private key using loopback (no TTY needed)
        echo "$GPG_PRIVATE_KEY" | gpg --batch --yes \
          --pinentry-mode loopback \
          --passphrase "$GPG_PASSPHRASE" \
          --import

        # 5. Get the keygrip and preset the passphrase directly into the agent
        KEYGRIP=$(gpg --with-keygrip --list-secret-keys "${{ secrets.GPG_KEY_EMAIL }}" \
          | grep 'Keygrip' | head -1 | awk '{print $3}')
        echo "Keygrip found: $KEYGRIP"
        echo "$GPG_PASSPHRASE" | /usr/lib/gnupg2/gpg-preset-passphrase --preset "$KEYGRIP"

        # 6. Create a minimal batch GPG wrapper with loopback so it uses the agent cache
        printf '#!/bin/bash\ngpg --batch --no-tty --pinentry-mode loopback "$@"\n' > /tmp/gpg-wrapper
        chmod +x /tmp/gpg-wrapper

        # 7. Configure RPM macros to use our wrapper
        printf "%%_signature gpg\n%%_gpg_name %s\n%%__gpg /tmp/gpg-wrapper\n" \
          "${{ secrets.GPG_KEY_EMAIL }}" > ~/.rpmmacros

        # 8. Sign the RPM
        rpmsign --addsign release/*.rpm

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mytwocents-${{ matrix.target }}
        path: release/*

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Release ${{ needs.version.outputs.new_tag }}
          body: |
            ## 🛠️ O que mudou nesta versão:
            ${{ needs.version.outputs.changelog }}
            
            ---
            *Gerado automaticamente pelo MyTwoCents Build System*
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: false
